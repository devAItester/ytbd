name: Проверка сохранённого снимка AsForJS

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/AsForJS/**"
      - "scripts/validate_snapshot.py"
      - ".github/workflows/validate-snapshot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Проверить снимок данных
        run: python scripts/validate_snapshot.py
