name: Проверка сохранённых данных и тесты

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/AsForJS/**"
      - "scripts/validate_snapshot.py"
      - "scripts/collect.py"
      - "scripts/process_channels.py"
      - "scripts/smoke_live.py"
      - "tests/**"
      - ".github/workflows/validate-snapshot.yml"
      - "README.md"
      - "templates/**"
  push:
    paths:
      - "examples/AsForJS/**"
      - "scripts/validate_snapshot.py"
      - "scripts/collect.py"
      - "scripts/process_channels.py"
      - "scripts/smoke_live.py"
      - "tests/**"
      - ".github/workflows/validate-snapshot.yml"
      - "README.md"
      - "templates/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Установить библиотеку шаблонов
        run: python -m pip install --upgrade Jinja2
      - name: Проверить сохранённый снимок
        run: python scripts/validate_snapshot.py
      - name: Проверить тесты сборщика без сетевых запросов
        run: python -m unittest discover -s tests -v
  live-navigation-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Установить инструменты сбора и шаблонов
        run: python -m pip install --upgrade yt-dlp Jinja2
      - name: Проверить живой сбор и все три Markdown-представления
        run: |
          mkdir -p "$RUNNER_TEMP/ytbd-live-smoke"
          python scripts/smoke_live.py --artifacts "$RUNNER_TEMP/ytbd-live-smoke"
      - name: Сохранить результаты live-проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytbd-live-markdown-${{ github.run_id }}
          path: ${{ runner.temp }}/ytbd-live-smoke/
          if-no-files-found: warn
          retention-days: 7
