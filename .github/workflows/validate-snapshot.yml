name: Validate saved AsForJS snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/AsForJS/**"
      - "scripts/validate_snapshot.py"
      - ".github/workflows/validate-snapshot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate snapshot
        run: python scripts/validate_snapshot.py
