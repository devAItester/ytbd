name: Проверка сохранённых данных и тесты

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/AsForJS/**"
      - "scripts/validate_snapshot.py"
      - "scripts/collect.py"
      - "scripts/process_channels.py"
      - "tests/**"
      - ".github/workflows/validate-snapshot.yml"
      - "README.md"
      - "templates/**"
  push:
    paths:
      - "examples/AsForJS/**"
      - "scripts/validate_snapshot.py"
      - "scripts/collect.py"
      - "scripts/process_channels.py"
      - "tests/**"
      - ".github/workflows/validate-snapshot.yml"
      - "README.md"
      - "templates/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Установить библиотеку шаблонов
        run: python -m pip install --upgrade Jinja2
      - name: Проверить сохранённый снимок
        run: python scripts/validate_snapshot.py
      - name: Проверить тесты сборщика без сетевых запросов
        run: python -m unittest discover -s tests -v
  live-navigation-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Установить библиотеку шаблонов
        run: python -m pip install --upgrade Jinja2
      - name: Проверить навигацию публичного канала
        run: python -c "from scripts.process_channels import discover_tabs; print(discover_tabs('https://www.youtube.com/@RTFMurych'))"
