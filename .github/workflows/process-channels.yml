name: Обновить архив YouTube и представления

on:
  workflow_dispatch:
    inputs:
      template:
        description: Шаблон Markdown-представления
        required: true
        default: outline.md
        type: choice
        options:
          - outline.md
          - archive.md
          - index.md
          - full.md
      detail_limit:
        description: Число уникальных видео для подробной проверки; 0 означает все видео
        required: true
        default: 5
        type: number
      download_media:
        description: Сохранить обложки, субтитры и текстовые транскрипты (без видеофайлов)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Установить инструменты сбора и шаблонов
        run: python -m pip install --upgrade yt-dlp Jinja2
      - name: Проверить каналы и обновить архив
        run: |
          args=(--template "${{ inputs.template }}" --detail-limit "${{ inputs.detail_limit }}")
          if [[ "${{ inputs.download_media }}" == "true" ]]; then
            args+=(--download-media)
          fi
          python scripts/process_channels.py "${args[@]}"
      - name: Сохранить исходные данные и Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channels data/output
          if git diff --cached --quiet; then
            echo "Изменений в сохранённых данных и Markdown нет."
          else
            git commit -m "Обновить архив YouTube и Markdown-представления"
            git push
          fi
