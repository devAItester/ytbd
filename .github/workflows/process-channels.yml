name: Обновить представления каналов

on:
  workflow_dispatch:
    inputs:
      last_lines:
        description: Сколько последних непустых строк из config/channels.txt обработать
        required: true
        default: "4"
        type: number

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Установить yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Обработать выбранное количество адресов
        run: python scripts/process_channels.py --last-lines "${{ inputs.last_lines }}"
      - name: Сохранить представления в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channels
          if git diff --cached --quiet; then
            echo "Новых изменений в представлениях каналов нет."
          else
            git commit -m "Обновить представления каналов"
            git push
          fi
